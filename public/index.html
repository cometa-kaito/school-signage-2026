<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Signage</title>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-RM584Q3Z41"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-RM584Q3Z41');
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="common.css">
    <link rel="stylesheet" href="style.css">
    <!-- ページ読み込み時に最上部にスクロール -->
    <script>
        // 即時実行でスクロール位置をリセット
        if ('scrollRestoration' in history) {
            history.scrollRestoration = 'manual';
        }
        window.scrollTo(0, 0);
    </script>
    <!-- サイネージ用レイアウト（JavaScriptで動的に切り替え） -->
    <style>
        /* デフォルト: 2カラムレイアウト */
        html, body {
            overflow: hidden;
            height: 100vh;
            max-height: 100vh;
            margin: 0;
            padding: 0;
        }
        .container {
            display: grid;
            grid-template-columns: 68fr 32fr;
            grid-template-areas: "info ad";
            height: 100vh;
            max-height: 100vh;
            overflow: hidden;
        }
        .info-area {
            grid-area: info;
            height: 100vh;
            max-height: 100vh;
            overflow: hidden;
        }
        .ad-area {
            grid-area: ad;
            display: flex;
            height: 100vh;
            max-height: 100vh;
            min-height: 100vh;
        }
        /* モバイル用広告: 初期非表示（JSで制御） */
        .mobile-ad-area {
            display: none;
            flex-direction: column;
            width: 100%;
            height: 100vh;
            min-height: 100vh;
            align-items: center;
            justify-content: flex-start;
            background: linear-gradient(-45deg, #141E30, #243B55, #2c3e50, #4ca1af);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            flex-shrink: 0;
            position: relative;
            overflow: hidden;
        }
        .mobile-ad-area::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at 30% 50%, rgba(255,255,255,0.1) 0%, transparent 50%);
            pointer-events: none;
        }
        .mobile-ad-header {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            padding: 5px 8px;
            background: rgba(0, 0, 0, 0.3);
            color: white;
            font-size: 0.75rem;
            z-index: 10;
        }
        .mobile-ad-container {
            flex: 1;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            min-height: 0;
        }
        .mobile-ad-link {
            display: flex;
            width: 100%;
            height: 100%;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            overflow: hidden;
        }
        .mobile-ad-media {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
            cursor: pointer;
            transition: transform 0.3s ease;
        }
        .mobile-ad-link:hover .mobile-ad-media {
            transform: scale(1.02);
        }
        .mobile-ad-indicator {
            position: absolute;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 6px;
            z-index: 10;
        }
        .mobile-ad-indicator .indicator-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(255,255,255,0.4);
            transition: all 0.3s ease;
        }
        .mobile-ad-indicator .indicator-dot.active {
            background: white;
            transform: scale(1.3);
        }
        /* 静音モード時のモバイル広告エリア */
        .mobile-ad-area.quiet-mode .mobile-ad-container {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .mobile-ad-area.quiet-mode::after {
            content: "📚 授業中";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.2rem;
            color: rgba(255,255,255,0.6);
            z-index: 5;
        }
        .mobile-ad-area.quiet-mode .mobile-ad-media {
            display: none !important;
        }
        .mobile-ad-area.quiet-mode .mobile-ad-indicator {
            display: none;
        }

        /* 縦長モード用スタイル（JSでbodyにvertical-modeクラスが追加されたとき適用） */
        body.vertical-mode {
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            overflow-x: hidden;
            height: auto;
            min-height: 100vh;
            max-height: none;
            -webkit-overflow-scrolling: touch;
        }
        body.vertical-mode .container {
            display: contents;
        }
        body.vertical-mode .ad-area {
            display: none !important;
        }
        /* モバイル広告: 最初に表示 (order: -1で最上部に) */
        body.vertical-mode .mobile-ad-area {
            display: flex;
            order: -1;
        }
        /* info-areaの中身を再構成 */
        body.vertical-mode .info-area {
            order: 1;
            display: flex;
            flex-direction: column;
            width: 100%;
            height: auto;
            max-height: none;
            overflow: visible;
            padding: 10px;
        }
        body.vertical-mode .content-grid {
            display: flex;
            flex-direction: column;
            height: auto;
            overflow: visible;
            order: 1;
        }
        body.vertical-mode .card {
            display: block;
            height: auto;
            min-height: auto;
            max-height: none;
            overflow: visible;
            margin-bottom: 15px;
        }
        /* スマホ（レスポンシブ）モード: 全て表示、スクロールで閲覧 */
        /* 予定セクション */
        body.vertical-mode .schedule-section {
            grid-column: auto;
            order: 1;
            min-height: auto;
            max-height: none;
            overflow: visible;
        }
        /* 連絡セクション */
        body.vertical-mode .notice-section {
            order: 2;
            max-height: none;
            overflow: visible;
        }
        /* 提出物セクション */
        body.vertical-mode .assignment-section {
            order: 3;
            max-height: none;
            overflow: visible;
        }
        /* プレースホルダー行のスタイル */
        .notice-placeholder,
        .assignment-placeholder {
            visibility: hidden;
        }
        body.vertical-mode .schedule-grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            /* min-heightはJSで動的に設定するため、ここでは指定しない */
            max-height: none;
            overflow: visible;
            gap: 4px;
        }
        body.vertical-mode .schedule-day-column {
            /* min-heightはJSで動的に設定するため、ここでは指定しない */
            max-height: none;
            overflow: visible;
            display: flex;
            flex-direction: column;
        }
        body.vertical-mode .schedule-scroll-area {
            flex: 1;
            /* min-heightはJSで動的に設定するため、ここでは指定しない */
            max-height: none;
            overflow: visible;
        }
        body.vertical-mode .schedule-list-item {
            font-size: clamp(0.8rem, 3vw, 1rem);
            padding: 0.4rem 0;
            line-height: 1.4;
        }
        body.vertical-mode .schedule-date-header {
            font-size: clamp(0.75rem, 2.5vw, 0.95rem);
            padding: 0.3rem;
            flex-shrink: 0;
        }
        body.vertical-mode .no-schedule {
            /* min-heightは親要素で確保 */
            padding: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
        }
        body.vertical-mode .list-group,
        body.vertical-mode .table-wrapper {
            height: auto;
            max-height: none;
            overflow: visible;
        }
        body.vertical-mode .branding {
            order: 4;
            padding: 8px 0;
            margin-bottom: 0;
        }
        /* ページ下部の余白を削除 */
        body.vertical-mode .info-area {
            padding-bottom: 0;
        }
        body.vertical-mode .card:last-child {
            margin-bottom: 8px;
        }
    </style>
</head>
<body>
    <!-- モバイル用広告エリア（狭い画面で上部に表示） -->
    <div class="mobile-ad-area">
        <!-- モバイル用ヘッダー情報 -->
        <div class="mobile-ad-header">
            <span id="mobile-current-date" class="date-text">--月--日</span>
            <span id="mobile-current-day" class="day-badge">--</span>
            <span id="mobile-current-time" class="time-text">--:--</span>
            <span id="mobile-class-name" class="class-title">--</span>
        </div>
        <!-- 広告コンテナ -->
        <div class="mobile-ad-container">
            <a id="mobile-ad-link" href="#" target="_blank" rel="noopener noreferrer" class="mobile-ad-link">
                <img id="mobile-ad-image" src="" alt="Advertisement" class="mobile-ad-media">
                <video id="mobile-ad-video" src="" muted playsinline class="mobile-ad-media" style="display: none;"></video>
            </a>
            <!-- 広告インジケーター -->
            <div id="mobile-ad-indicator" class="mobile-ad-indicator"></div>
        </div>
    </div>

    <div class="container">
        <!-- 広告エリア（広い画面用：右側に表示） -->
        <aside class="ad-area">
            <!-- ヘッダー情報を広告エリア上部に表示 -->
            <div class="ad-header">
                <span id="current-date" class="date-text">--月--日</span>
                <span id="current-day" class="day-badge">--</span>
                <span id="current-time" class="time-text">--:--</span>
                <span id="class-name" class="class-title">--</span>
            </div>
            <div class="ad-container">
                <a id="ad-link" href="#" target="_blank" rel="noopener noreferrer" style="display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; text-decoration: none; overflow: hidden;">
                    <img id="ad-image" src="" alt="Advertisement" style="display: block; width: 100%; height: 100%; object-fit: contain; cursor: pointer;">
                    <video id="ad-video" src="" muted playsinline style="display: none; width: 100%; height: 100%; object-fit: contain; cursor: pointer;"></video>
                </a>
            </div>
        </aside>

        <!-- 情報エリア -->
        <main class="info-area">
            <div class="content-grid">
                <section class="card schedule-section">
                    <h2>
                        <span class="icon">📅</span> 今後3日間の予定
                        <button id="calendar-btn" class="calendar-toggle-btn" title="カレンダーで見る">
                            <span class="calendar-icon">📆</span>
                        </button>
                    </h2>
                    <div id="schedule-grid" class="schedule-grid-container"></div>
                </section>

    <!-- カレンダーモーダル -->
    <div id="calendar-modal" class="calendar-modal">
        <div class="calendar-modal-content">
            <div class="calendar-modal-header">
                <button id="calendar-prev-month" class="calendar-nav-btn">&lt;</button>
                <h3 id="calendar-month-title">2024年1月</h3>
                <button id="calendar-next-month" class="calendar-nav-btn">&gt;</button>
                <button id="calendar-close-btn" class="calendar-close-btn">&times;</button>
            </div>
            <div class="calendar-grid">
                <div class="calendar-weekdays">
                    <span>日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span>
                </div>
                <div id="calendar-days" class="calendar-days"></div>
            </div>
            <div id="calendar-schedule-detail" class="calendar-schedule-detail">
                <p class="calendar-detail-placeholder">日付を選択してください</p>
            </div>
        </div>
    </div>

                <section class="card notice-section">
                    <h2><span class="icon">📢</span> 各種連絡</h2>
                    <ul id="notice-list" class="list-group"></ul>
                </section>

                <section class="card assignment-section">
                    <h2><span class="icon">⚠️</span> 提出物管理</h2>
                    <div class="table-wrapper">
                        <table class="task-table">
                            <thead>
                                <tr>
                                    <th width="30%">期限</th>
                                    <th width="20%">科目</th>
                                    <th width="50%">提出物</th>
                                </tr>
                            </thead>
                            <tbody id="assignment-list"></tbody>
                        </table>
                    </div>
                </section>
            </div>

            <footer class="branding">キミテラス by Rebounder</footer>
        </main>
    </div>

    <script type="module" src="main.js"></script>
</body>
</html>
