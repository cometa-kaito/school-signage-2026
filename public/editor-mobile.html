<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>サイネージ管理 | キミテラス</title>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-RM584Q3Z41"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-RM584Q3Z41');
    </script>
    <link rel="stylesheet" href="common.css">
    <link rel="stylesheet" href="auth-style.css">
    <link rel="stylesheet" href="editor-mobile-style.css">
    <!-- フォールバック: Firebase SDKがブロックされた場合のタイムアウト処理 -->
    <script>
        window.firebaseLoaded = false;
        setTimeout(function() {
            if (!window.firebaseLoaded) {
                var login = document.getElementById('loginContainer');
                var error = document.getElementById('loginError');
                if (login) login.style.display = 'flex';
                if (error) {
                    error.textContent = 'ネットワーク接続を確認してください。Firebaseへの接続がブロックされている可能性があります。';
                    error.style.display = 'block';
                }
            }
        }, 5000);
    </script>
</head>
<body>
    <!-- ログイン画面 -->
    <div id="loginContainer" class="login-container">
        <div class="login-box">
            <h2>🔐 連絡登録ログイン</h2>

            <div id="loginError" class="error-msg"></div>

            <!-- タブ切り替え -->
            <div class="login-tabs">
                <button class="login-tab active" data-tab="editor">コンテンツ編集</button>
                <button class="login-tab" data-tab="admin">管理者</button>
            </div>

            <!-- エディターログイン（パスワードのみ） -->
            <form id="editorLoginForm" class="login-form-tab">
                <div class="form-group">
                    <label for="editorPassword">編集パスワード</label>
                    <input type="password" id="editorPassword" required
                           placeholder="パスワード" autocomplete="current-password">
                </div>
                <button type="submit" id="editorLoginBtn" class="login-btn">ログイン</button>
            </form>

            <!-- 管理者ログイン（Email + Password） -->
            <form id="loginForm" class="login-form-tab" style="display: none;">
                <div class="form-group">
                    <label for="loginEmail">メールアドレス</label>
                    <input type="email" id="loginEmail"
                           placeholder="admin@example.com" autocomplete="email">
                </div>
                <div class="form-group">
                    <label for="loginPassword">パスワード</label>
                    <input type="password" id="loginPassword"
                           placeholder="パスワード" autocomplete="current-password">
                </div>
                <button type="submit" id="loginBtn" class="login-btn">ログイン</button>

                <div class="divider"><span>または</span></div>

                <button type="button" id="googleLoginBtn" class="google-btn">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
                    Googleでログイン
                </button>
            </form>

            <p class="login-note">※コンテンツ編集はパスワードのみでログインできます</p>
        </div>
    </div>

    <!-- アプリ本体 -->
    <div id="appContainer">
        <div class="app-header">
            <h1>📢 コンテンツ編集（スマホ）</h1>
            <div class="header-right">
                <span id="contextLabel" style="font-size:13px;color:#667eea;margin-right:8px;"></span>
                <span id="userEmail" class="user-email"></span>
                <button id="logoutBtn" class="logout-btn">ログアウト</button>
            </div>
        </div>

        <!-- コンテキスト選択画面（パラメータ不足時） -->
        <div id="contextSelectorView" style="display:none;"></div>

        <!-- メインコンテンツ -->
        <div id="adminContent">
        <div id="successMsg" class="success-msg">登録が完了しました！</div>
        <div id="errorMsg" class="error-msg"></div>

        <div class="card" id="target-date-card">
            <label for="target-date">対象日</label>
            <input type="date" id="target-date">
        </div>

        <div class="tabs">
            <button class="tab-btn active" data-tab="schedule">予定</button>
            <button class="tab-btn" data-tab="notice">連絡</button>
            <button class="tab-btn" data-tab="assignment">提出物</button>
        </div>

        <div class="card">
            <div id="form-schedule">
                <label for="sched-time-select">時間</label>
                <select id="sched-time-select" onchange="toggleCustomTime()">
                    <option value="">-- 選択 --</option>
                    <option value="終日">終日 (All Day)</option>
                    <option value="1限">1限</option>
                    <option value="2限">2限</option>
                    <option value="3限">3限</option>
                    <option value="4限">4限</option>
                    <option value="5限">5限</option>
                    <option value="6限">6限</option>
                    <option value="その他">その他（自由入力）</option>
                </select>
                <div id="custom-time-group" style="display: none;">
                    <label for="sched-time-custom">自由入力</label>
                    <input type="text" id="sched-time-custom" placeholder="例: 放課後, 13:30">
                </div>
                <label for="sched-content">内容</label>
                <input type="text" id="sched-content" placeholder="避難訓練">
                <label for="sched-location">場所</label>
                <input type="text" id="sched-location" placeholder="グラウンド">
                
                <div class="optional-section">
                    <div class="optional-header" onclick="toggleOptional('sched-optional')">
                        ▶ 表示期間（オプション）
                    </div>
                    <div id="sched-optional" class="optional-fields hidden">
                        <label for="sched-display-start">表示開始日</label>
                        <input type="date" id="sched-display-start">
                        <label for="sched-display-end">表示終了日</label>
                        <input type="date" id="sched-display-end">
                    </div>
                </div>
            </div>

            <div id="form-notice" class="hidden">
                <label for="notice-text">連絡内容</label>
                <textarea id="notice-text" rows="3" placeholder="体操服を忘れないように"></textarea>
                <div class="checkbox-row">
                    <input type="checkbox" id="notice-highlight">
                    <span style="color: #e74c3c;">重要（赤字にする）</span>
                </div>
                <div class="checkbox-row">
                    <input type="checkbox" id="notice-sound">
                    <span>🔔 通知音を鳴らす</span>
                </div>

                <div class="optional-section">
                    <div class="optional-header" onclick="toggleOptional('notice-optional')">
                        ▶ 表示期間（オプション）
                    </div>
                    <div id="notice-optional" class="optional-fields hidden">
                        <label for="notice-display-start">表示開始日</label>
                        <input type="date" id="notice-display-start">
                        <label for="notice-display-end">表示終了日</label>
                        <input type="date" id="notice-display-end">
                    </div>
                </div>
            </div>

            <div id="form-assignment" class="hidden">
                <label for="assign-deadline">提出期限</label>
                <input type="date" id="assign-deadline">
                <label for="assign-subject">科目</label>
                <select id="assign-subject">
                    <option value="実習">実習</option>
                    <option value="数学">数学</option>
                    <option value="英語">英語</option>
                    <option value="HR">ホームルーム</option>
                    <option value="その他">その他</option>
                </select>
                <label for="assign-task">提出物名</label>
                <input type="text" id="assign-task" placeholder="レポート">
            </div>

            <button class="submit-btn" id="submitBtn">登録する</button>
        </div>
        </div><!-- /adminContent -->
    </div>

    <!-- ローディングオーバーレイ -->
    <div id="loadingOverlay" class="loading-overlay" style="display:none;">
        <div style="text-align:center;">
            <div class="loading-spinner"></div>
            <p style="margin-top:16px;color:#667eea;font-weight:bold;">処理中...</p>
        </div>
    </div>

    <script type="module" src="editor-mobile-app.js"></script>
</body>
</html>
