<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>クラス設定 | キミテラス Admin</title>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-RM584Q3Z41"></script>
    <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-RM584Q3Z41');</script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="common.css">
    <link rel="stylesheet" href="auth-style.css">
    <link rel="stylesheet" href="admin-style.css">
    <script>
        window.firebaseLoaded = false;
        setTimeout(function() {
            if (!window.firebaseLoaded) {
                var l = document.getElementById('loginContainer');
                var e = document.getElementById('loginError');
                if (l) l.style.display = 'flex';
                if (e) { e.textContent = 'ネットワーク接続を確認してください。'; e.style.display = 'block'; }
            }
        }, 5000);
    </script>
</head>
<body>
    <!-- ログイン画面 -->
    <div id="loginContainer" class="login-container">
        <div class="login-box">
            <h2>管理者ログイン</h2>
            <div id="loginError" class="error-msg"></div>
            <form id="loginForm">
                <div class="form-group"><label for="loginEmail">メールアドレス</label><input type="email" id="loginEmail" required placeholder="admin@example.com" autocomplete="email"></div>
                <div class="form-group"><label for="loginPassword">パスワード</label><input type="password" id="loginPassword" required placeholder="パスワード" autocomplete="current-password"></div>
                <button type="submit" id="loginBtn" class="login-btn">ログイン</button>
            </form>
            <div class="divider"><span>または</span></div>
            <button type="button" id="googleLoginBtn" class="google-btn"><img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">Googleでログイン</button>
            <p class="login-note">※管理者のみログインできます</p>
        </div>
    </div>

    <!-- アプリ本体 -->
    <div id="appContainer">
        <header class="admin-header">
            <h1 id="pageTitle">クラス設定</h1>
            <div class="header-right">
                <span id="userEmail" class="user-email"></span>
                <button id="logoutBtn" class="btn-logout">ログアウト</button>
            </div>
        </header>

        <!-- コンテキスト選択画面（パラメータ不足時） -->
        <div id="contextSelectorView" style="display:none;"></div>

        <!-- メインコンテンツ -->
        <main id="mainContent" class="main-content">
            <!-- パンくず -->
            <div id="breadcrumb" style="margin-bottom:16px;">
                <a id="backLink" href="school-admin.html" style="color:#667eea;text-decoration:none;">&lt; 学校管理に戻る</a>
            </div>

            <!-- クラス情報ヘッダー -->
            <div class="card" style="margin-bottom:20px;">
                <h2 id="classHeader">クラス設定</h2>
                <p id="classSubheader" style="color:#888;font-size:13px;margin:4px 0 0;"></p>
            </div>

            <!-- 広告管理 -->
            <div class="card">
                <div class="card-header">
                    <h2>広告管理</h2>
                    <button class="btn btn-primary" id="addAdBtn">+ 広告追加</button>
                </div>
                <p class="setting-description">最大5枚まで。画像または動画をアップロードできます。</p>
                <div id="adListContainer" class="ad-management-list"></div>
                <input type="file" id="adFileInput" accept="image/*,video/*" hidden>
            </div>

            <!-- 授業時間設定（クラス個別） -->
            <div class="card">
                <div class="card-header"><h2>授業時間設定（広告非表示）</h2></div>
                <p class="setting-description">この時間帯は広告が非表示になります。未設定の場合、学校マスター設定が適用されます。</p>
                <div id="quietHoursContainer">
                    <div id="quietHoursList"></div>
                    <button class="btn btn-secondary" id="addQuietHourBtn">+ 時間帯追加</button>
                </div>
                <button class="btn btn-primary" id="saveQuietHoursBtn" style="margin-top:8px;">設定保存</button>
                <p id="masterFallbackNote" style="display:none;margin-top:8px;font-size:12px;color:#888;"></p>
            </div>
        </main>
    </div>

    <!-- ローディングオーバーレイ -->
    <div id="loadingOverlay" class="loading-overlay" style="display:none;">
        <div style="text-align:center;">
            <div class="loading-spinner"></div>
            <p style="margin-top:16px;color:#667eea;font-weight:bold;">処理中...</p>
        </div>
    </div>

    <script type="module" src="class-settings-app.js"></script>
</body>
</html>
